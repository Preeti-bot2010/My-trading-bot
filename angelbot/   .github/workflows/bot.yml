name: Paper Trading Bot

# Runs automatically every 10 minutes during NSE market hours (Mon-Fri),
# and can also be triggered manually from the GitHub app/website anytime.
#
# Cron times are in UTC. IST = UTC + 5:30, so 9:15-15:30 IST ≈ 3:45-10:00 UTC.
# GitHub's free scheduler is NOT guaranteed to the exact minute (can lag
# 5-15 min under load) - fine for a 15-min-candle swing strategy, not for
# second-by-second scalping.
on:
  schedule:
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch: {}   # lets you tap "Run workflow" manually to test

permissions:
  contents: write   # needed so the bot can commit status.json back to the repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one trading pass
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING: "false"   # hardcoded false here on purpose - see README
        run: python run_once.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add status.json trades_log.csv open_positions.json options_trades_log.csv options_open_positions.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Bot run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
